server:
  port: 8080

spring:
  application:
    name: User-Profile

  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:assignmentdb
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    initialization-mode: always
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: none
